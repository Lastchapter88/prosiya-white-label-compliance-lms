<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<script>
			(function(){try{var p=localStorage.getItem('prosiya-theme-preference');var h=new Date().getHours();var t=p==='day'||p==='night'?p:((h>=18||h<6)?'night':'day');document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t==='night'?'dark':'light';}catch(e){}})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
